name: Build Windows x64
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build with Streamline 2.14.16
        shell: cmd
        run: build.bat
      - name: Upload binaries and licenses
        uses: actions/upload-artifact@v4
        with:
          name: ACV-DLSS-Streamline-2.14.16-x64
          path: |
            bin/*.dll
            bin/*.txt
            bin/*.md
          if-no-files-found: error

